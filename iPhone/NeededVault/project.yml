# Needed Vault for iPhone. "Make-Needed-Vault-iPhone.command" turns this into
# NeededVault.xcodeproj (with XcodeGen) and opens it in Xcode.
name: NeededVault
options:
  bundleIdPrefix: com.thiswasneeded
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ${NV_TEAM}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
targets:
  NeededVault:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Needed Vault
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [raleway-latin-200-normal.ttf, raleway-latin-300-normal.ttf, raleway-latin-400-normal.ttf, raleway-latin-500-normal.ttf, oswald-latin-400-normal.ttf, courier-prime-latin-400-normal.ttf]
        NSPhotoLibraryUsageDescription: Needed Vault saves your latest screenshot into a project when you ask it to.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/NeededVault.entitlements
      properties:
        com.apple.security.application-groups: [group.com.thiswasneeded.neededvault]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thiswasneeded.neededvault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Needed Vault
    dependencies:
      - target: NeededVaultShare
  NeededVaultShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      - path: Shared
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Needed Vault
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [raleway-latin-200-normal.ttf, raleway-latin-300-normal.ttf, raleway-latin-400-normal.ttf, raleway-latin-500-normal.ttf, oswald-latin-400-normal.ttf, courier-prime-latin-400-normal.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 30
              NSExtensionActivationSupportsMovieWithMaxCount: 10
    entitlements:
      path: Share/NeededVaultShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.thiswasneeded.neededvault]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thiswasneeded.neededvault.share
