    if (w) S[w] = S[w].filter(x => !((p.email && x.email === p.email) || (!p.email && x.name === p.name)));
    else S[S.field].push({ id: p.id || '', name: p.name || '', email: p.email || '' });
  }
  async function sendClick(t) {
    const d = t.dataset;
    keepTyping();
    if (t.id === 'toPay') { closeSheet(); return call('projectTool', { id: 'pay' }); }
    if (d.field) { S.field = d.field; return renderSend(); }
    if (d.tab) { S.tab = d.tab; return renderSend(); }
    if (d.unto) { const [k, i] = d.unto.split(':'); S[k].splice(+i, 1); return renderSend(); }
    if (d.unfile) { S.files = S.files.filter(r => r !== d.unfile); return renderSend(); }
    if (d.addmail != null) {
      const p = renderSend.shown[+d.addmail]; if (!p) return;
      const email = (prompt(`${p.name}'s email — saved to your contacts for every tool`) || '').trim();
      if (!isEmail(email)) { if (email) toast("That doesn't look like an email"); return; }
      const r = await call('contactSave', { contact: { id: p.id || undefined, name: p.name, email, role: p.role || '', handle: p.handle || '' } }).catch(() => null);
      if (r) {
        D.contacts = r.contacts;
        if (p.crewId) { const c = list('crew').find(x => x.id === p.crewId); if (c) { c.contact = r.contact.id; c.email = email; save('crew', D.crew, true); } }
        ['to', 'cc', 'bcc'].forEach(k => S[k].forEach(x => { if (!x.email && x.name === p.name) x.email = email; }));
      }
      return renderSend();
    }
    if (t.id === 'saveDraft' || t.id === 'dropDraft') {
      const r = await call('projectDraft', t.id === 'dropDraft' ? { remove: S.id } : { draft: { id: S.id, files: S.files, to: S.to, cc: S.cc, bcc: S.bcc, subject: S.subject, body: S.body, copy: S.copy } }).catch(() => null);
      if (r) D.drafts = r.drafts || [];
      if (t.id === 'dropDraft') { closeSheet(); return toast('Draft deleted'); }
      toast('Draft saved with the project'); return renderSend();
    }
    if (t.id === 'sendGo') {
      t.disabled = true; t.textContent = 'Sending…';
      const r = await call('projectSend', { files: S.files, to: S.to, cc: S.cc, bcc: S.bcc, subject: S.subject, body: S.body, copy: S.copy, draft: S.id }).catch(() => null);
      if (!r || !r.ok) { toast((r && r.error) || "Couldn't send — try again"); return renderSend(); }
      if (r.data) D = r.data;
      picked.clear(); closeSheet(); render(); loadCalendar();
      toast('Sent');
    }
  }

  /* ---- the contact book ---- */
  let pq = '';
  function dupes(all) {
    const out = [], norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
    for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
      const a = all[i], b = all[j];
      if ((norm(a.name) && norm(a.name) === norm(b.name)) || (a.email && b.email && a.email.toLowerCase() === b.email.toLowerCase())) out.push([a, b]);
    }
    return out.slice(0, 6);
  }
  function renderPeople() {
    const all = D.contacts || [];
    const q = pq.toLowerCase();
    const shown = all.filter(c => !q || [c.name, c.email, c.role, c.company, c.handle].join(' ').toLowerCase().includes(q));
    openSheet('people', `
      <div class="shead"><div class="grow"><h3>Contacts</h3>
        <span class="note">One book for every tool: crew from Credit, clients from Pay, and everyone on your projects. Fix a name or add an email here and every tool has it.</span></div>${closeBtn}</div>
      ${dupes(all).map(([a, b]) => `<div class="dupe"><span class="grow">Same person? <b style="font-weight:500">${esc(a.name || a.email)}</b> ${esc(a.email ? '· ' + a.email : '')} and <b style="font-weight:500">${esc(b.name || b.email)}</b> ${esc(b.email ? '· ' + b.email : '')}</span>
        <button class="btnl" style="padding:8px 14px" data-merge="${esc(a.id)}:${esc(b.id)}">Merge</button></div>`).join('')}
      <label class="search"><input id="pbq" placeholder="Search ${all.length} people" value="${esc(pq)}" spellcheck="false"></label>
      <div style="max-height:52vh;overflow-y:auto">${shown.map(c => `<div class="pp" data-cid="${esc(c.id)}">
          <input data-c="name" value="${esc(c.name || '')}" placeholder="Name" spellcheck="false">
          <input data-c="role" value="${esc(c.role || '')}" placeholder="Role" spellcheck="false">
          <input data-c="email" value="${esc(c.email || '')}" placeholder="email" spellcheck="false">
          <input data-c="handle" value="${esc(c.handle || '')}" placeholder="@handle" spellcheck="false">
          <button class="x" style="opacity:1" data-rmc="${esc(c.id)}" aria-label="Remove ${esc(c.name || c.email)}">×</button></div>`).join('') || '<div class="note2">No one yet. Credit remembers crew as you read call sheets; Pay remembers clients as you invoice them.</div>'}</div>
      <div class="foot"><span class="grow">Kept with the app, and a copy in your vault.</span><button class="btnd" data-close>Done</button></div>`, 'narrow');
    const s = $('pbq');
    s.addEventListener('input', () => { pq = s.value; const pos = s.selectionStart; renderPeople(); const n = $('pbq'); n.focus(); n.setSelectionRange(pos, pos); });
  }
  async function peopleClick(t) {
    const d = t.dataset;
    if (d.merge) { const [keep, drop] = d.merge.split(':'); const r = await call('contactMerge', { keep, drop }).catch(() => null); if (r) { D.contacts = r.contacts; renderPeople(); toast('Merged'); } }
    if (d.rmc) { const r = await call('contactRemove', { id: d.rmc }).catch(() => null); if (r) { D.contacts = r.contacts; renderPeople(); } }
  }
  async function peopleChange(t) {
    const row = t.closest('.pp[data-cid]'); if (!row || !t.dataset.c) return;
    const r = await call('contactSave', { contact: { id: row.dataset.cid, [t.dataset.c]: t.value } }).catch(() => null);
    if (r) D.contacts = r.contacts;
  }

  /* ------------------------------------------------------------ the app tells us */
  window.__neededShared = s => {
    s = s || {};
    const prev = shared; shared = s;
    const changed = !D || s.project !== prev.project || s.vault !== prev.vault;
    const labelChanged = D && D.vault && (s.label !== D.label || (s.tags || []).join() !== (D.tags || []).join());
    if (changed) { picked.clear(); crewAll = false; editingDel = null; adding = false; if (sheet) closeSheet(); load(); }
    else if (labelChanged && !adding) { D.label = s.label; D.tags = s.tags || []; D.labels = s.labels || D.labels; renderHead(); }
    else if (s.tab === 'project' && prev.tab !== 'project' && !sheet) load();      // fresh each time you come back to it
  };
  window.__neededSynced = () => load();
  call('state').then(s => window.__neededShared(s)).catch(() => {});
})();
</script>
</body></html>
