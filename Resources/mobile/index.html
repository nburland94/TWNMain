<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-title" content="Needed Vault">
<meta name="theme-color" content="#fcf2ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Needed Vault</title>
<style>
@font-face{font-family:'Raleway';font-weight:200;font-display:swap;src:url('fonts/raleway-latin-200-normal.woff2') format('woff2')}
@font-face{font-family:'Raleway';font-weight:300;font-display:swap;src:url('fonts/raleway-latin-300-normal.woff2') format('woff2')}
@font-face{font-family:'Raleway';font-weight:400;font-display:swap;src:url('fonts/raleway-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Raleway';font-weight:500;font-display:swap;src:url('fonts/raleway-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Oswald';font-weight:400;font-display:swap;src:url('fonts/oswald-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Courier Prime';font-weight:400;font-display:swap;src:url('fonts/courier-prime-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Courier Prime';font-weight:700;font-display:swap;src:url('fonts/courier-prime-latin-700-normal.woff2') format('woff2')}
:root{--o:#F05A22;--oi:#d2440f;--ink:#141414;--soft:#6b6964;--ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fcf2ec;color:var(--ink);font-family:'Raleway',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;cursor:pointer;color:inherit}
button:active{transform:scale(0.97)}
.glow{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 90% 60% at 50% 38%,#f7bf99 0%,#f9cfb1 28%,#fbdfca 52%,#fcebdf 74%,#fdf5ef 100%);opacity:.75;pointer-events:none}
.cap{font-family:'Courier Prime',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#7a5a48}
.g{background:linear-gradient(160deg,rgba(255,255,255,.74),rgba(255,255,255,.5));border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 14px 40px rgba(160,70,20,.1);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:5px 11px;font-size:12.5px;border:1px solid rgba(28,28,28,.12);background:rgba(255,255,255,.75);color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dark{border:none;border-radius:100px;padding:13px 20px;font-size:15px;font-weight:500;background:linear-gradient(180deg,#2b2b2b,#111);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 8px rgba(20,20,20,.16);text-decoration:none;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.light{border-radius:100px;padding:12px 18px;font-size:14.5px;border:1px solid rgba(28,28,28,.12);background:rgba(255,255,255,.8);color:var(--ink);text-decoration:none;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tog{position:relative;width:44px;height:26px;border-radius:100px;border:none;background:rgba(28,28,28,.18);padding:0;flex-shrink:0;transition:background .25s}
.tog::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .25s var(--ease)}
.tog.on{background:var(--o)}.tog.on::after{left:21px}
.off{display:none!important}

header{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 14px) 18px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(to bottom,rgba(252,236,224,.92) 70%,rgba(252,236,224,0))}
header img{width:34px;display:block}
.pill{border:none;border-radius:100px;padding:8px 14px;background:var(--o);color:#fff;font-size:14px;display:flex;align-items:center;gap:6px;max-width:48vw}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gg{display:flex;align-items:center;gap:8px;font-family:Oswald,sans-serif;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.gg.on{color:var(--oi)}
main{padding:0 18px calc(env(safe-area-inset-bottom) + 110px)}
.titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.titlerow h1{margin:0;font-weight:200;font-size:34px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;margin:12px 0 14px;align-items:center}
.chips .grow{flex-grow:1}
.search{display:none;margin:-4px 0 12px}
.search input{width:100%;font:inherit;font-size:16px;border-radius:100px;border:1px solid rgba(28,28,28,.12);background:rgba(255,255,255,.85);padding:10px 16px;outline:none}
.grid{display:flex;flex-direction:column;gap:5px;margin:0 -4px}
.row{display:flex;gap:5px}
.tile{position:relative;border:none;padding:0;border-radius:8px;overflow:hidden;background:#d9cfc4}
.tile img{display:block;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:6px;bottom:6px;font-family:'Courier Prime',monospace;font-size:9.5px;letter-spacing:.1em;color:#fff;background:rgba(0,0,0,.45);border-radius:4px;padding:1px 5px}
.badge.new{left:auto;right:6px;background:var(--o)}
.empty{font-size:14px;color:var(--soft);line-height:1.5;padding:30px 4px;text-align:center}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:40px 18px calc(env(safe-area-inset-bottom) + 20px);display:flex;gap:8px;background:linear-gradient(to top,rgba(252,242,236,.98) 45%,rgba(252,242,236,0))}
.bottom .dark{flex-grow:1}

/* Grab & Go on */
.banner{border-radius:18px;padding:14px 16px;background:var(--o);color:#fff;display:flex;flex-direction:column;gap:4px;box-shadow:0 12px 30px rgba(240,90,34,.3);margin-top:6px}
.banner b{font-family:Oswald,sans-serif;font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.banner span{font-size:14px;line-height:1.45}
.target{width:100%;border-radius:22px;height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1.5px dashed rgba(240,90,34,.55)!important;margin:16px 0}
.target b{font-weight:200;font-size:26px}
.target span{font-size:13px;color:var(--soft);max-width:240px;line-height:1.45;text-align:center}
.feedhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.feed{display:flex;flex-direction:column}
.feed .it{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(28,28,28,.07)}
.feed .th{width:48px;height:34px;border-radius:6px;flex-shrink:0;background:#d9cfc4 center/cover no-repeat}
.feed .tx{display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0}
.feed .tx span:first-child{font-size:13.5px}
.feed .tx span+span{font-family:'Courier Prime',monospace;font-size:10.5px;color:var(--soft)}
.feed .st{font-size:12px;color:#2f7d4a;white-space:nowrap}
.note{font-size:11.5px;color:var(--soft);line-height:1.45;margin-top:10px}

/* one picture */
.view{position:fixed;inset:0;z-index:20;background:#0b0b0b;color:#f4f3f1;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .35s var(--ease)}
.view.on{transform:none}
.view .top{padding:calc(env(safe-area-inset-top) + 14px) 18px 0;display:flex;align-items:center;justify-content:space-between}
.view .back{border:none;background:rgba(255,255,255,.12);color:#fff;border-radius:100px;padding:8px 14px;font-size:14px}
.view .n{font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.55)}
.view .pic{margin-top:28px;height:42vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.view .pic img{max-width:100%;max-height:100%;display:block;image-rendering:auto}
.view .pic .grad{width:100%;height:100%}
.view .acts>*{height:48px}
.view .info{padding:22px 20px 0;display:flex;flex-direction:column;gap:14px}
.view .info .t{font-weight:300;font-size:22px}
.view .info .m{font-family:'Courier Prime',monospace;font-size:11.5px;letter-spacing:.08em;color:rgba(255,255,255,.55)}
.view .sw{display:flex;gap:6px}.view .sw i{width:26px;height:26px;border-radius:7px;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.view .tags{display:flex;gap:6px;flex-wrap:wrap}
.view .tags .chip{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2)}
.view .acts{margin-top:auto;padding:0 18px calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:8px}
.view .acts .light{flex-grow:1;background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2)}
.view .acts .light.small{flex-grow:0}
.view .hint{text-align:center;font-size:11px;color:rgba(255,255,255,.4);padding-bottom:calc(env(safe-area-inset-bottom) + 10px)}

/* sheets: projects, and the first time */
.veil{position:fixed;inset:0;z-index:30;background:rgba(60,30,15,.22);opacity:0;pointer-events:none;transition:opacity .25s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:31;border-radius:28px;padding:22px 20px 20px;transform:translateY(120%);transition:transform .35s var(--ease);max-height:80vh;overflow:auto;background:linear-gradient(160deg,rgba(255,255,255,.96),rgba(255,255,255,.9))}
.sheet.on{transform:none}
.sheet h2{margin:6px 0 16px;font-weight:200;font-size:30px;line-height:1.1}
.plist{display:flex;flex-direction:column}
.plist button{border:none;background:transparent;text-align:left;padding:13px 2px;border-bottom:1px solid rgba(28,28,28,.07);display:flex;align-items:baseline;gap:10px;font-size:16px}
.plist button small{margin-left:auto;font-family:'Courier Prime',monospace;font-size:11px;color:var(--soft)}
.plist button.on{color:var(--oi)}
.steps{display:flex;flex-direction:column;gap:10px}
.steps .dark,.steps .light{width:100%}
.steps .n{font-family:'Courier Prime',monospace;font-size:12px;opacity:.6}
.small{font-size:12.5px;color:var(--soft);line-height:1.45;margin:12px 2px 0;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:40;transform:translate(-50%,8px);white-space:nowrap;border-radius:100px;padding:10px 16px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* pairing and "can't reach your Mac" */
.gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:0 26px calc(env(safe-area-inset-bottom) + 40px)}
.gate img{width:56px}
.gate h1{margin:0;font-weight:200;font-size:40px;line-height:1.08}
.gate p{margin:0;font-size:15px;color:var(--soft);line-height:1.55}
.gate ol{margin:0;padding:16px 18px 16px 36px;border-radius:22px;font-size:14px;line-height:1.5;display:flex;flex-direction:column;gap:8px}
.gate .dark{align-self:stretch}
.prog{position:fixed;left:18px;right:18px;top:calc(env(safe-area-inset-top) + 8px);z-index:45;height:3px;border-radius:3px;background:rgba(240,90,34,.15);overflow:hidden;opacity:0;transition:opacity .2s}
.prog.on{opacity:1}.prog i{display:block;height:100%;width:0;background:var(--o);transition:width .2s}
.view video{max-width:100%;max-height:100%;display:block;background:#000}
.addpics{display:flex;gap:6px;overflow-x:auto;margin:0 -2px 14px;padding:2px}
.addpics span{flex-shrink:0;width:72px;height:54px;border-radius:8px;background:#2b2b2b center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
.pchips{display:flex;gap:6px;overflow-x:auto;margin:6px 0 12px;padding:2px}
.pchips .chip{flex-shrink:0}
.tagin{width:100%;font:inherit;font-size:16px;border-radius:100px;border:1px solid rgba(28,28,28,.12);background:rgba(255,255,255,.9);padding:12px 16px;outline:none;margin-bottom:14px}
.tagin:focus{border-color:var(--o)}
</style></head>
<body>
<div class="glow"></div>
<div class="prog" id="prog"><i id="progBar"></i></div>

<!-- Not paired, or can't reach the Mac -->
<section class="gate" id="gate">
  <img src="mark.png" alt="This Was Needed">
  <h1 id="gateTitle">Needed Vault</h1>
  <p id="gateText">Opening your vault…</p>
  <ol class="g off" id="gateSteps"></ol>
  <p id="gateWhy" class="off" style="font-size:12px;font-family:'Courier Prime',monospace"></p>
  <button class="dark off" id="retry">Try again</button>
</section>

<div id="app" class="off">
<header>
  <img src="mark.png" alt="This Was Needed">
  <button class="pill" id="pill" aria-haspopup="dialog"><span id="pillName">Projects</span> <svg width="10" height="7" viewBox="0 0 10 7" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="#fff" stroke-width="1.5"/></svg></button>
  <span style="flex-grow:1"></span>
  <span class="gg" id="ggWrap">Grab &amp; Go <button class="tog" id="gg" aria-label="Grab and Go" aria-pressed="false"></button></span>
</header>

<main>
  <section id="browse">
    <div class="titlerow"><h1 id="title">Needed Vault</h1><span class="cap" id="count"></span></div>
    <div class="chips" id="chips">
      <button class="chip on" data-k="all">All</button><button class="chip" data-k="still">Stills</button><button class="chip" data-k="clip">Clips</button><button class="chip" data-k="gif">GIFs</button>
      <span class="grow"></span>
      <button class="chip" id="searchBtn" aria-label="Search"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    </div>
    <div class="search" id="search"><input id="q" type="search" placeholder="Search — tags, names" autocomplete="off" autocapitalize="off"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="on" class="off">
    <div class="banner"><b>Grab &amp; Go is on</b><span id="onLine"></span></div>
    <button class="g target" id="bigTap"><b>Tap to add</b><span>Pick from Photos — they go straight in, no questions</span></button>
    <div class="feedhead"><span class="cap" id="todayN">Today</span><button class="chip" id="camera2">Camera</button></div>
    <div class="feed" id="feed"></div>
    <div class="note" id="onNote"></div>
  </section>
</main>

<div class="bottom" id="bottom">
  <button class="dark" id="photos"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg>Photos</button>
  <button class="light" id="camera"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.6" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><circle cx="12" cy="12.5" r="3.2"/><path d="M8.5 6l1.5-2h4l1.5 2"/></svg>Camera</button>
</div>
<input type="file" id="pick" accept="image/*,video/*" multiple hidden>
<input type="file" id="shoot" accept="image/*,video/*" capture="environment" hidden>
</div>

<div class="view" id="view" role="dialog" aria-label="One picture">
  <div class="top"><button class="back" id="vBack"></button><span class="n" id="vN"></span></div>
  <div class="pic" id="vPic"></div>
  <div class="info"><span class="t" id="vT"></span><span class="m" id="vM"></span><div class="sw" id="vSw"></div><div class="tags" id="vTags"></div></div>
  <div class="acts"><button class="light" id="vSrc">Open the source ↗</button><button class="light small" id="vShare">Share</button></div>
  <div class="hint">Swipe for the next · cropping and boards stay on the Mac</div>
</div>

<div class="veil" id="veil"></div>
<div class="g sheet" id="projSheet" role="dialog" aria-label="Projects"><span class="cap">Your projects</span><h2>Open a project</h2><div class="plist" id="plist"></div></div>
<div class="g sheet" id="addSheet" role="dialog" aria-label="Add to the vault">
  <span class="cap">Add to the vault</span><h2 id="addTitle">To file</h2>
  <div class="addpics" id="addPics"></div>
  <span class="cap">Into</span>
  <div class="pchips" id="addProjects"></div>
  <input class="tagin" id="addTags" placeholder="Tags, if you like — night, car" autocomplete="off" autocapitalize="off">
  <div class="steps"><button class="dark" id="addGo">Add</button><button class="light" id="addCancel">Cancel</button></div>
</div>
<div class="g toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var get = function (k, d) { try { var v = localStorage.getItem('nv.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  var put = function (k, v) { try { localStorage.setItem('nv.' + k, JSON.stringify(v)); } catch (e) {} };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function toast(t, ms) { var e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { e.classList.remove('show'); }, ms || 2600); }

  // The key from the QR code: kept on this phone, then out of the address bar.
  var m = location.hash.match(/k=([A-Za-z0-9]+)/);
  if (m) { put('key', m[1]); history.replaceState(null, '', location.pathname); }
  var KEY = get('key', '');
  addEventListener('hashchange', function () {
    var h = location.hash.match(/k=([A-Za-z0-9]+)/); if (!h) return;
    put('key', h[1]); KEY = h[1]; history.replaceState(null, '', location.pathname); start();
  });
  var q = function (id) { return 'id=' + encodeURIComponent(id) + '&k=' + encodeURIComponent(KEY); };
  function api(path, opt) {
    opt = opt || {};
    opt.headers = Object.assign({ 'X-Key': KEY }, opt.headers || {});
    // Never a blank wait: ten seconds and it says it can't reach the Mac.
    var ctl = window.AbortController ? new AbortController() : null, t = ctl ? setTimeout(function () { ctl.abort(); }, 10000) : 0;
    if (ctl) opt.signal = ctl.signal;
    return fetch(path, opt).then(function (r) {
      clearTimeout(t);
      if (r.status === 401) { var e = new Error('key'); e.key = true; throw e; }
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    });
  }

  var S = { projects: [], project: get('project', ''), items: [], grabGo: get('grabGo', ''), kind: 'all', q: '', fresh: {}, mac: 'your Mac' };
  var sent = function () { return get('sent', []); };

  function gate(kind, why) {
    $('app').classList.add('off'); $('gate').classList.remove('off'); $('gateSteps').classList.remove('off');
    $('gateWhy').classList.toggle('off', !why); $('gateWhy').textContent = why || '';
    if (kind === 'pair') {
      $('gateTitle').textContent = 'Needed Vault';
      $('gateText').textContent = 'Your vault, on your phone — straight from your Mac, over your Wi-Fi.';
      $('gateSteps').innerHTML = '<li>On your Mac: Needed Tools › Home › <b>Your phone</b> › switch it on.</li><li>Point this phone’s camera at the QR code there.</li><li>Then Share › <b>Add to Home Screen</b>.</li>';
      $('retry').classList.add('off');
    } else {
      $('gateTitle').textContent = 'Can’t reach ' + (get('mac', 'your Mac'));
      $('gateText').textContent = 'Needed Vault talks straight to your Mac, so they need to be together.';
      $('gateSteps').innerHTML = '<li>This phone on the same Wi-Fi as your Mac (or your Mac on this phone’s hotspot).</li><li>Your Mac awake, with Needed Tools open and <b>Your phone</b> switched on.</li><li>Still stuck? On the Mac, Your phone › “Use the Mac’s number instead”, and scan that.</li>';
      $('retry').classList.remove('off');
    }
  }
  $('retry').addEventListener('click', function () { $('gateTitle').textContent = 'Needed Vault'; $('gateText').textContent = 'Opening your vault…'; $('gateSteps').classList.add('off'); $('gateWhy').classList.add('off'); $('retry').classList.add('off'); start(); });

  function start() {
    if (!KEY) return gate('pair');
    return api('/api/state').then(function (s) {
      S.projects = s.projects || []; S.mac = s.mac || 'your Mac'; put('mac', S.mac);
      if (!S.project || !S.projects.some(function (p) { return p.n === S.project; })) { S.project = s.current && s.current !== 'Unsorted' ? s.current : ((S.projects[0] || {}).n || ''); put('project', S.project); }
      if (S.grabGo && !S.projects.some(function (p) { return p.n === S.grabGo; })) { S.grabGo = ''; put('grabGo', ''); }
      $('gate').classList.add('off'); $('app').classList.remove('off');
      draw(); return loadItems();
    }).catch(function (e) { gate(e.key ? 'pair' : 'away', e.key ? '' : (e.name === 'AbortError' ? 'No answer from the Mac in 10 seconds.' : String(e.message || e))); });
  }
  function loadItems() {
    if (!S.project) { S.items = []; return draw(); }
    var p = S.project;
    return api('/api/items?p=' + encodeURIComponent(p)).then(function (r) { if (p === S.project) { S.items = r.items || []; draw(); } });
  }

  function kindName(k) { return k === 'clip' ? 'Clip' : k === 'gif' ? 'GIF' : 'Still'; }
  function listNow() {
    var s = S.q.trim().toLowerCase();
    return S.items.filter(function (it) {
      if (S.kind !== 'all' && it.k !== S.kind) return false;
      return !s || [it.n, (it.g || []).join(' ')].join(' ').toLowerCase().indexOf(s) >= 0;
    });
  }
  function drawGrid() {
    var list = listNow(), w = Math.min(innerWidth, 560) - 28, rows = [], row = [], sum = 0, target = 118;
    list.forEach(function (it, i) { var a = Math.min(3, Math.max(0.4, it.a || 1.5)); row.push([it, a, i]); sum += a; if (sum * target + (row.length - 1) * 5 >= w) { rows.push([row, sum]); row = []; sum = 0; } });
    if (row.length) rows.push([row, Math.max(sum, w / target * 0.75)]);
    $('grid').innerHTML = list.length ? rows.map(function (r) {
      var h = Math.round((w - (r[0].length - 1) * 5) / r[1]);
      return '<div class="row">' + r[0].map(function (c) {
        var it = c[0], g = it.c || ['#d9cfc4', '#b8a898'];
        return '<button class="tile" data-i="' + c[2] + '" style="flex:' + c[1] + ' 1 0;height:' + h + 'px;background:linear-gradient(160deg,' + esc(g[0]) + ',' + esc(g[1] || g[0]) + ')"><img alt="" loading="lazy" src="/api/thumb?' + q(it.id) + '">'
          + (it.k !== 'still' ? '<span class="badge">' + (it.k === 'clip' ? 'CLIP' : 'GIF') + '</span>' : '') + (S.fresh[it.id] ? '<span class="badge new">NEW</span>' : '') + '</button>';
      }).join('') + '</div>';
    }).join('') : '<div class="empty">' + (S.items.length ? 'Nothing matches.' : 'Nothing in ' + esc(S.project || 'this project') + ' yet — Photos below adds some.') + '</div>';
  }
  function drawFeed() {
    var today = new Date().toDateString(), list = sent().filter(function (x) { return new Date(x.at).toDateString() === today; });
    var n = list.reduce(function (a, x) { return a + (x.n || 0); }, 0);
    $('todayN').textContent = 'Today, ' + n + ' added';
    $('feed').innerHTML = list.length ? list.map(function (x) {
      var t = new Date(x.at), hm = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2);
      return '<div class="it"><span class="th" style="' + (x.th ? 'background-image:url(' + x.th + ')' : '') + '"></span><span class="tx"><span>' + esc(x.what) + ' ' + hm + '</span><span>' + esc((x.tags || []).map(function (t) { return '#' + t; }).join(' ')) + '</span></span><span class="st">In ' + esc(x.p) + '</span></div>';
    }).join('') : '<div class="empty" style="padding:18px 0">Nothing yet today.</div>';
    $('onNote').textContent = 'Everything goes straight into ' + (S.grabGo || 'the project') + '’s vault on ' + S.mac + '.';
  }
  function draw() {
    var on = !!S.grabGo, cur = S.projects.filter(function (p) { return p.n === S.project; })[0];
    $('pillName').textContent = (on ? S.grabGo : S.project) || 'Projects';
    $('gg').classList.toggle('on', on); $('gg').setAttribute('aria-pressed', on); $('ggWrap').classList.toggle('on', on);
    $('browse').classList.toggle('off', on); $('on').classList.toggle('off', !on); $('bottom').classList.toggle('off', on);
    $('title').textContent = S.project || 'Needed Vault';
    $('count').textContent = (cur ? cur.c : S.items.length) + ' in the vault';
    [].forEach.call(document.querySelectorAll('#chips [data-k]'), function (b) { b.classList.toggle('on', b.dataset.k === S.kind); });
    if (on) { $('onLine').textContent = 'Everything goes straight into ' + S.grabGo + '. No questions until you switch it off.'; drawFeed(); } else drawGrid();
  }

  /* ---- projects */
  function sheet(id, open) {
    ['projSheet', 'addSheet'].forEach(function (s) { $(s).classList.toggle('on', open && s === id); });
    $('veil').classList.toggle('on', !!open);
  }
  $('veil').addEventListener('click', function () { sheet(null, false); pending = []; });
  $('pill').addEventListener('click', function () {
    $('plist').innerHTML = S.projects.map(function (p) {
      return '<button class="' + (p.n === (S.grabGo || S.project) ? 'on' : '') + '" data-p="' + esc(p.n) + '">' + esc(p.n) + '<small>' + (p.c || 0) + (p.l ? ' · ' + esc(p.l) : '') + '</small></button>';
    }).join('') || '<div class="empty">No projects on your Mac yet.</div>';
    sheet('projSheet', true);
  });
  $('plist').addEventListener('click', function (e) {
    var b = e.target.closest('[data-p]'); if (!b) return;
    S.project = b.dataset.p; put('project', S.project); sheet(null, false); S.kind = 'all'; S.q = ''; $('q').value = '';
    if (S.grabGo) { S.grabGo = S.project; put('grabGo', S.grabGo); }          // Grab & Go follows the project you pick
    S.items = []; draw(); loadItems();
  });
  $('gg').addEventListener('click', function () {
    S.grabGo = S.grabGo ? '' : S.project; put('grabGo', S.grabGo);
    toast(S.grabGo ? 'Grab & Go on — ' + S.grabGo : 'Grab & Go off'); draw();
  });

  /* ---- adding: Photos or the camera, straight in (Grab & Go) or pick the project and tags */
  var pending = [];
  $('photos').addEventListener('click', function () { $('pick').click(); });
  $('bigTap').addEventListener('click', function () { $('pick').click(); });
  $('camera').addEventListener('click', function () { $('shoot').click(); });
  $('camera2').addEventListener('click', function () { $('shoot').click(); });
  function picked(e) {
    var files = [].slice.call(e.target.files || []); e.target.value = '';
    if (!files.length) return;
    if (S.grabGo) return upload(files, S.grabGo, []);
    pending = files;
    $('addTitle').textContent = files.length === 1 ? 'One to file' : files.length + ' to file';
    $('addPics').innerHTML = files.slice(0, 30).map(function (f) { return /^image\//.test(f.type) ? '<span style="background-image:url(' + URL.createObjectURL(f) + ')"></span>' : '<span>clip</span>'; }).join('');
    addTo = S.project; drawAddProjects(); $('addTags').value = '';
    sheet('addSheet', true);
  }
  $('pick').addEventListener('change', picked);
  $('shoot').addEventListener('change', picked);
  var addTo = '';
  function drawAddProjects() {
    $('addProjects').innerHTML = S.projects.map(function (p) { return '<button class="chip' + (p.n === addTo ? ' on' : '') + '" data-to="' + esc(p.n) + '">' + esc(p.n) + '</button>'; }).join('');
    $('addGo').textContent = 'Add to ' + (addTo || '…');
  }
  $('addProjects').addEventListener('click', function (e) { var b = e.target.closest('[data-to]'); if (b) { addTo = b.dataset.to; drawAddProjects(); } });
  $('addCancel').addEventListener('click', function () { pending = []; sheet(null, false); });
  $('addGo').addEventListener('click', function () {
    if (!addTo || !pending.length) return;
    var tags = $('addTags').value.split(/[\s,#]+/).filter(Boolean);
    var files = pending; pending = []; sheet(null, false);
    upload(files, addTo, tags);
  });

  function thumbOf(f) {
    if (!/^image\//.test(f.type) || !window.createImageBitmap) return Promise.resolve('');
    return createImageBitmap(f).then(function (b) {
      var c = document.createElement('canvas'), s = 96 / Math.max(b.width, b.height); c.width = Math.round(b.width * s); c.height = Math.round(b.height * s);
      c.getContext('2d').drawImage(b, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', 0.6);
    }).catch(function () { return ''; });
  }
  function send1(f, project, tags, i, n) {
    return new Promise(function (ok, no) {
      var x = new XMLHttpRequest(), name = f.name || ('Photo.' + ((f.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg').replace('quicktime', 'mov')));
      x.open('POST', '/api/upload?p=' + encodeURIComponent(project) + '&name=' + encodeURIComponent(name) + '&tags=' + encodeURIComponent(tags.join(',')));
      x.setRequestHeader('X-Key', KEY);
      x.upload.onprogress = function (e) { if (e.lengthComputable) $('progBar').style.width = Math.round(((i + e.loaded / e.total) / n) * 100) + '%'; };
      x.onload = function () { var r = null; try { r = JSON.parse(x.responseText); } catch (e) {} if (x.status === 200 && r && r.ok) ok(r); else no(new Error((r && r.error) || 'Couldn’t add it')); };
      x.onerror = function () { no(new Error('Lost your Mac — same Wi-Fi?')); };
      x.send(f);
    });
  }
  function upload(files, project, tags) {
    $('prog').classList.add('on'); $('progBar').style.width = '0%';
    var done = [], i = 0, n = files.length, first = files[0];
    toast('Adding ' + (n === 1 ? 'it' : n) + ' to ' + project + '…', 60000);
    function next() {
      if (i >= n) return finish();
      var f = files[i];
      return send1(f, project, tags, i, n).then(function (r) { done.push(r.id); S.fresh[r.id] = true; i++; return next(); });
    }
    function finish() {
      $('prog').classList.remove('on');
      thumbOf(first).then(function (th) {
        var list = sent(); list.unshift({ p: project, n: done.length, th: th, tags: tags, at: Date.now(), what: done.length === 1 ? (/^video\//.test(first.type) ? 'Clip' : 'Photo') : done.length + ' added' });
        put('sent', list.slice(0, 50));
        toast(done.length === 1 ? 'In ' + project : done.length + ' in ' + project);
        if (project !== S.project && !S.grabGo) { S.project = project; put('project', project); }
        loadItems(); draw();
      });
    }
    next().catch(function (e) { $('prog').classList.remove('on'); toast((done.length ? done.length + ' went in. ' : '') + e.message, 4000); loadItems(); });
  }

  /* ---- one picture, full screen; swipe for the next */
  var vi = -1;
  function openView(i) {
    var list = listNow(), it = list[i]; if (!it) return; vi = i;
    $('vBack').textContent = '‹ ' + (S.project || 'Back'); $('vN').textContent = (i + 1) + ' / ' + list.length;
    var src = '/api/file?' + q(it.id);
    $('vPic').innerHTML = it.k === 'clip' ? '<video src="' + src + '" controls playsinline preload="metadata" poster="/api/thumb?' + q(it.id) + '"></video>' : '<img alt="" src="' + src + '">';
    $('vT').textContent = it.n || kindName(it.k);
    $('vM').textContent = [kindName(it.k), it.s && it.s !== 'file' && it.s !== 'phone' ? it.s : '', it.d ? 'added ' + it.d : ''].filter(Boolean).join(' · ');
    $('vSw').innerHTML = (it.c || []).map(function (c) { return '<i style="background:' + esc(c) + '"></i>'; }).join('');
    $('vTags').innerHTML = (it.g || []).map(function (t) { return '<span class="chip">#' + esc(t) + '</span>'; }).join('');
    $('vSrc').classList.toggle('off', !it.u);
    $('view').classList.add('on');
  }
  function closeView() { var v = $('vPic').querySelector('video'); if (v) v.pause(); $('view').classList.remove('on'); }
  $('grid').addEventListener('click', function (e) { var b = e.target.closest('.tile'); if (b) openView(+b.dataset.i); });
  $('vBack').addEventListener('click', closeView);
  $('vSrc').addEventListener('click', function () { var it = listNow()[vi]; if (it && it.u) window.open(it.u, '_blank'); });
  $('vShare').addEventListener('click', function () {
    var it = listNow()[vi]; if (!it || !navigator.share) return;
    if (it.u) return navigator.share({ title: it.n, url: it.u }).catch(function () {});
    fetch('/api/file?' + q(it.id)).then(function (r) { return r.blob(); }).then(function (b) {
      var f = new File([b], (it.n || 'Needed Vault') + '.' + ((b.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg').replace('quicktime', 'mov')), { type: b.type });
      if (navigator.canShare && navigator.canShare({ files: [f] })) return navigator.share({ files: [f] });
      return navigator.share({ title: it.n || 'From Needed Vault' });
    }).catch(function () {});
  });
  var x0 = null;
  $('view').addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  $('view').addEventListener('touchend', function (e) { if (x0 == null) return; var d = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(d) > 50) openView(vi + (d < 0 ? 1 : -1)); });

  /* ---- filters */
  $('chips').addEventListener('click', function (e) { var b = e.target.closest('[data-k]'); if (b) { S.kind = b.dataset.k; draw(); } });
  $('searchBtn').addEventListener('click', function () { var s = $('search'); var on = s.style.display !== 'block'; s.style.display = on ? 'block' : 'none'; if (on) $('q').focus(); else { $('q').value = ''; S.q = ''; drawGrid(); } });
  $('q').addEventListener('input', function () { S.q = $('q').value; drawGrid(); });

  addEventListener('resize', function () { if (!S.grabGo) drawGrid(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && KEY) start(); });   // back to it: fresh from the Mac
  start();
})();
</script>
</body></html>
